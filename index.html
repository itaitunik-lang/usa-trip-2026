<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12100f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
<title>מסלול Yosemite ו‑Grand Circle · אוגוסט 2026</title>
<meta name="description" content="מסלול טיול מפורט: יוסמיטי, זיון, ברייס, פייג', מוניומנט ואלי, גרנד קניון, סדונה וניו יורק — עם מפות, תחזית מזג אוויר, המלצות לבוש והוצאות.">

<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Grand Circle">
<style>
  /* ---------- theme ---------- */
  :root, :root[data-theme="dark"]{
    --bg:#12100f; --bg-2:#191614; --card:#1d1917; --card-2:#241f1c;
    --ink:#efe8e0; --ink-2:#cfc5ba; --muted:#968b80; --line:#332c27; --line-2:#443a33;
    --a:#e8734a; --a-soft:#2a1a13; --a-line:#5c2c1a; --a-strong:#ff9066;
    --b:#4fb9a1; --b-soft:#14282a; --b-line:#235049;
    --gold:#e0a94a; --gold-soft:#2a2114; --gold-line:#5a4520;
    --warn:#f2685f; --warn-soft:#2e1917; --warn-line:#6b2f2a;
    --ok:#5cc48a; --ok-soft:#152a1f; --ok-line:#265c40;
    --shadow:0 4px 20px rgba(0,0,0,.45);
    --map-filter:invert(.92) hue-rotate(180deg) saturate(.75);
    --scrim:rgba(0,0,0,.45);
  }
  /* High-contrast daylight palette — the dark theme is unreadable in desert sun */
  :root[data-theme="light"]{
    --bg:#f7f3ec; --bg-2:#fffdf9; --card:#ffffff; --card-2:#f3ede3;
    --ink:#1d1815; --ink-2:#463c33; --muted:#6d6157; --line:#e2d8c9; --line-2:#cfc2ae;
    --a:#b4441c; --a-soft:#fdece4; --a-line:#efc4ad; --a-strong:#8f3413;
    --b:#166b59; --b-soft:#e2f2ed; --b-line:#a9d6c9;
    --gold:#8a6212; --gold-soft:#fbf1d8; --gold-line:#e3cf9c;
    --warn:#a52d22; --warn-soft:#fdeae7; --warn-line:#f0bdb5;
    --ok:#1c6b3f; --ok-soft:#e3f3e8; --ok-line:#aad9bd;
    --shadow:0 2px 10px rgba(60,40,20,.10);
    --map-filter:none;
    --scrim:rgba(0,0,0,.30);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{direction:rtl; text-align:right; margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,"Arial Hebrew",sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
    padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
  a{color:var(--b)}
  h1,h2,h3{line-height:1.25}
  .skip{position:absolute; right:-9999px; top:8px; background:var(--a); color:var(--bg);
    padding:8px 14px; border-radius:8px; z-index:200; font-weight:700}
  .skip:focus{right:8px}

  /* ---------- header, logo, theme switch ---------- */
  header.top{position:relative;
    background:radial-gradient(120% 140% at 15% 0%, #7d3a20 0%, transparent 60%),
      linear-gradient(140deg,#3a1c12,#1a1110 70%);
    border-bottom:1px solid var(--line);
    padding:calc(20px + env(safe-area-inset-top)) 16px 22px}
  :root[data-theme="light"] header.top{
    background:radial-gradient(120% 140% at 15% 0%, #f5c9a8 0%, transparent 62%),
      linear-gradient(140deg,#fbe6d5,#f7f3ec 72%)}
  .top-in{max-width:980px; margin:0 auto; padding-inline-start:108px}
  header.top h1{margin:0 0 4px; font-size:1.5rem; letter-spacing:-.01em; color:#fff}
  header.top p{margin:0; color:rgba(255,255,255,.82); font-size:.9rem}
  .top-facts{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:11px;
    font-size:.8rem; color:rgba(255,255,255,.65)}
  :root[data-theme="light"] header.top h1{color:#3a1c12}
  :root[data-theme="light"] header.top p{color:#6b4a37}
  :root[data-theme="light"] .top-facts{color:#8a6a55}

  .topbtns{position:absolute; top:calc(18px + env(safe-area-inset-top)); left:16px; z-index:60;
    display:flex; gap:8px}
  .logo{width:44px; height:44px; border-radius:14px; cursor:pointer;
    background:linear-gradient(145deg,#e8734a,#a8401f); border:1px solid #6d2f18;
    color:#1a0d07; font-size:1.3rem; display:grid; place-items:center;
    box-shadow:0 3px 14px rgba(0,0,0,.5)}
  .iconbtn{width:44px; height:44px; border-radius:14px; cursor:pointer; font-size:1.15rem;
    background:var(--card); border:1px solid var(--line-2); color:var(--ink);
    display:grid; place-items:center; font-family:inherit}
  .logo:hover,.iconbtn:hover{filter:brightness(1.12)}
  .logo:focus-visible,.iconbtn:focus-visible{outline:3px solid var(--b); outline-offset:3px}

  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:98}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; left:0; height:100%; width:min(310px,86vw); z-index:99;
    background:var(--bg-2); border-inline-end:1px solid var(--line);
    transform:translateX(-102%); transition:transform .24s cubic-bezier(.3,.7,.3,1);
    display:flex; flex-direction:column; box-shadow:14px 0 40px rgba(0,0,0,.5);
    padding-top:env(safe-area-inset-top); overflow-y:auto}
  .drawer.on{transform:translateX(0)}
  .drawer-h{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
  .drawer-h b{display:block; font-size:1.05rem}
  .drawer-h span{color:var(--muted); font-size:.8rem}
  .drawer nav{padding:10px; display:grid; gap:4px}
  .mitem{display:flex; align-items:center; gap:12px; width:100%; text-align:right;
    background:none; border:1px solid transparent; border-radius:11px; padding:12px 13px;
    color:var(--ink); font-size:.96rem; font-weight:600; cursor:pointer; font-family:inherit}
  .mitem:hover{background:var(--card)}
  .mitem[aria-current="page"]{background:var(--a-soft); border-color:var(--a-line); color:var(--a)}
  .mitem .ic{font-size:1.15rem; width:24px; text-align:center}
  .mitem .ct{margin-inline-start:auto; font-size:.72rem; font-weight:700; color:var(--muted);
    background:var(--card-2); border:1px solid var(--line); border-radius:999px; padding:1px 8px}
  .drawer-tools{padding:4px 10px 10px; display:grid; gap:4px; border-top:1px solid var(--line); margin-top:6px}
  .drawer-f{margin-top:auto; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line); color:var(--muted); font-size:.74rem}

  /* ---------- day tabs ---------- */
  nav.days{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 93%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .days-in{max-width:980px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
    scrollbar-width:none}
  .days-in::-webkit-scrollbar{display:none}
  .daytab{flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); color:var(--ink-2);
    border-radius:999px; padding:7px 14px; font-size:.85rem; font-weight:700; cursor:pointer;
    white-space:nowrap; min-height:44px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; line-height:1.15; font-family:inherit; position:relative}
  .daytab small{font-weight:400; color:var(--muted); font-size:.7rem}
  .daytab .wx{font-size:.68rem; color:var(--gold); font-weight:700}
  .daytab .wx.est{color:var(--muted); font-weight:600}
  .daytab[aria-selected="true"]{background:var(--a); border-color:var(--a); color:#fff}
  .daytab[aria-selected="true"] small,.daytab[aria-selected="true"] .wx{color:rgba(255,255,255,.8)}
  .daytab.today::after{content:""; position:absolute; top:4px; inset-inline-end:8px;
    width:7px; height:7px; border-radius:50%; background:var(--b)}
  .daytab:focus-visible{outline:3px solid var(--b); outline-offset:2px}

  main{max-width:980px; margin:0 auto; padding:16px 14px 44px}
  /* the desktop day-list sidebar; the >=1024px query below is the only place
     that turns it back on, so the off state has to live outside any query */
  #sideDays{display:none}

  /* ---------- offline / countdown strips ---------- */
  .strip{display:flex; align-items:center; gap:10px; border-radius:12px; padding:10px 14px;
    margin-bottom:14px; font-size:.86rem}
  .strip.off{background:var(--warn-soft); border:1px solid var(--warn-line); color:var(--ink-2)}
  .strip.count{background:var(--b-soft); border:1px solid var(--b-line); color:var(--ink-2)}
  .strip b{color:var(--ink)}

  /* ---------- day hero ---------- */
  .hero{position:relative; border-radius:var(--r,16px); overflow:hidden; margin-bottom:14px;
    border:1px solid var(--line); background:var(--card-2)}
  .hero img{display:block; width:100%; height:200px; object-fit:cover}
  .hero-txt{position:absolute; inset-inline:0; bottom:0; padding:14px 18px;
    background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.25) 60%, transparent)}
  .hero-txt h2{margin:0 0 8px; font-size:1.2rem; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.5)}
  .badges{display:flex; flex-wrap:wrap; gap:7px}
  .badge{font-size:.76rem; border-radius:999px; padding:4px 11px; border:1px solid rgba(255,255,255,.28);
    background:rgba(0,0,0,.42); color:#fff; backdrop-filter:blur(3px)}
  .badge.ok{background:rgba(28,107,63,.7); border-color:rgba(120,220,160,.4); font-weight:700}
  .badge.warn{background:rgba(165,45,34,.72); border-color:rgba(255,150,140,.4); font-weight:700}

  /* weather strip */
  .wxbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:14px}
  .wxbar .big{font-size:1.5rem}
  .wxbar .t{font-size:1.15rem; font-weight:800}
  .wxbar .t small{font-size:.85rem; font-weight:600; color:var(--muted)}
  .wxbar .lbl{color:var(--ink-2); font-size:.88rem}
  .wxbar .meta{color:var(--muted); font-size:.78rem; margin-inline-start:auto}
  .wxbar.est{border-style:dashed}

  .hot{background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:14px;
    padding:13px 16px; margin-bottom:16px}
  .hot h3{margin:0 0 8px; color:var(--gold); font-size:.98rem}
  .hot ul{margin:0; padding:0; list-style:none; display:grid; gap:6px}
  .hot li{background:var(--card); border:1px solid var(--line-2); border-radius:9px;
    padding:7px 11px; font-size:.87rem; font-weight:600}

  /* ---------- stops ---------- */
  .stop{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow)}
  .stop.now{border-color:var(--a); box-shadow:0 0 0 2px var(--a-soft), var(--shadow)}
  .stop.next{border-color:var(--b-line)}
  .stop-top{display:flex; align-items:flex-start; gap:12px}
  .stop-ico{font-size:1.45rem; flex:0 0 auto; line-height:1.4}
  .stop-main{flex:1; min-width:0}
  .stop-time{display:inline-block; font-size:.72rem; font-weight:700; color:var(--b);
    background:var(--b-soft); border:1px solid var(--b-line); border-radius:6px; padding:2px 8px; margin-bottom:5px}
  .nowtag{display:inline-block; font-size:.68rem; font-weight:800; border-radius:6px;
    padding:2px 8px; margin-inline-start:6px; vertical-align:middle}
  .nowtag.is-now{background:var(--a); color:#fff}
  .nowtag.is-next{background:var(--b-soft); color:var(--b); border:1px solid var(--b-line)}
  .stop-name{font-size:1.04rem; font-weight:800; margin:0 0 5px}
  .bk{font-size:.68rem; color:var(--ok); font-weight:700; vertical-align:middle}
  .stop-desc{font-size:.91rem; margin:0 0 8px; color:var(--ink-2)}
  .hl{list-style:none; margin:0 0 10px; padding:0}
  .hl li{position:relative; padding:2px 18px 2px 0; font-size:.87rem; color:var(--ink-2)}
  .hl li::before{content:"◂"; position:absolute; right:2px; color:var(--a); font-size:.7rem; top:5px}

  /* map row replaces the old live iframes: lighter, works offline, opens the real app */
  .maprow{display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    background:var(--card-2); border:1px solid var(--line); border-radius:11px; padding:9px 12px}
  .maprow .pin{font-size:1rem}
  .maprow .place{flex:1; min-width:120px; font-size:.82rem; color:var(--muted);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mbtn{display:inline-flex; align-items:center; gap:5px; text-decoration:none;
    border-radius:9px; padding:7px 12px; font-weight:700; font-size:.8rem; min-height:38px;
    border:1.5px solid var(--b); color:var(--b); background:transparent; white-space:nowrap}
  .mbtn:hover{background:var(--b); color:var(--bg)}
  .mbtn.go{border-color:var(--a); color:var(--a)}
  .mbtn.go:hover{background:var(--a); color:#fff}
  .mbtn:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

  .food,.tip{border-radius:12px; padding:11px 14px; margin-top:12px; font-size:.89rem; color:var(--ink-2)}
  .food{background:var(--b-soft); border:1px solid var(--b-line)} .food b{color:var(--b)}
  .tip{background:var(--gold-soft); border:1px solid var(--gold-line)} .tip b{color:var(--gold)}

  .dayacts{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .pager{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
  .pager button{flex:1; background:var(--card); border:1.5px solid var(--line-2); border-radius:12px;
    padding:13px; font-size:.9rem; font-weight:700; cursor:pointer; color:var(--ink); min-height:48px;
    font-family:inherit; display:flex; align-items:center; justify-content:center; gap:9px}
  .pager .ar{font-size:.8rem; color:var(--a); line-height:1}
  .pager button:hover:not(:disabled){border-color:var(--a); color:var(--a)}
  .pager button:disabled{opacity:.35; cursor:default}
  .pager button:disabled .ar{color:inherit}
  .pager button:focus-visible{outline:3px solid var(--b); outline-offset:2px}

  /* ---------- shared page bits ---------- */
  .page-h{margin:4px 0 18px}
  .page-h h2{margin:0 0 4px; font-size:1.4rem}
  .page-h p{margin:0; color:var(--muted); font-size:.86rem}
  .sec{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:6px 18px 14px; margin-bottom:16px}
  .sec h3{font-size:1rem; margin:15px 0 8px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .tag{font-size:.67rem; font-weight:700; padding:2px 9px; border-radius:999px}
  .t-urgent{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line)}
  .t-soon{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold-line)}
  .t-optional{background:var(--card-2); color:var(--muted); border:1px solid var(--line-2)}
  .t-done{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok-line)}
  .secnote{font-weight:400; font-size:.79rem; color:var(--muted)}
  .banner{background:var(--warn-soft); border:1px solid var(--warn-line); border-radius:12px;
    padding:12px 15px; margin-bottom:18px; font-size:.88rem; color:var(--ink-2)}

  .task{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{margin-top:4px; width:18px; height:18px; accent-color:var(--b); flex:none; cursor:pointer}
  .task .txt{flex:1; font-size:.93rem}
  .task .txt b{display:block; font-weight:700}
  .task .note{display:block; color:var(--muted); font-size:.82rem; margin-top:3px}
  .task.checked .txt b{text-decoration:line-through; color:var(--muted)}
  .qty{color:var(--a); font-weight:800}
  .done-list{list-style:none; margin:0; padding:0}
  .done-list li{padding:8px 0; border-bottom:1px solid var(--line); font-size:.88rem; color:var(--ink-2)}
  .done-list li:last-child{border-bottom:none}
  .done-list li::before{content:"✅ "}
  .done-list li span{color:var(--muted); font-size:.8rem}

  .cday{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 17px; margin-bottom:12px}
  .cday-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px}
  .cday-h b{font-size:1.02rem}
  .cday-h .d{color:var(--muted); font-size:.82rem}
  .cday-h .temp{margin-inline-start:auto; font-weight:800; color:var(--gold); font-size:.95rem}
  .cday .why{color:var(--ink-2); font-size:.87rem; margin:0 0 10px}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:.83rem; background:var(--card-2); border:1px solid var(--line-2);
    border-radius:999px; padding:5px 12px; color:var(--ink-2)}
  .chip.key{background:var(--a-soft); border-color:var(--a-line); color:var(--a-strong); font-weight:700}

  .progress{display:flex; align-items:center; gap:12px; margin-bottom:16px}
  .pbar{flex:1; height:9px; background:var(--card-2); border:1px solid var(--line-2); border-radius:999px; overflow:hidden}
  .pbar span{display:block; height:100%; background:linear-gradient(90deg,var(--a),var(--gold)); transition:width .25s}
  .pnum{font-weight:800; font-size:.86rem; color:var(--muted); white-space:nowrap}
  .plan{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:11px; margin-bottom:18px}
  .pcard{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px}
  .pcard b{display:block; font-size:.92rem; margin-bottom:3px}
  .pcard span{color:var(--ink-2); font-size:.83rem}

  .totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:18px}
  .tot{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
  .tot .k{color:var(--muted); font-size:.78rem; margin-bottom:3px}
  .tot .v{font-size:1.35rem; font-weight:800; letter-spacing:-.02em}
  .tot.main{background:linear-gradient(150deg,var(--a-soft),var(--card)); border-color:var(--a-line)}
  .tot.main .v{color:var(--a-strong)}
  .exp{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .exp:last-child{border-bottom:none}
  .exp .m{flex:1; min-width:0}
  .exp .m b{font-weight:700; font-size:.93rem}
  .exp .m .note{display:block; color:var(--muted); font-size:.81rem; margin-top:3px}
  .exp .amt{text-align:left; flex:0 0 auto; font-weight:800; font-size:.98rem; white-space:nowrap}
  .exp .amt .sub{display:block; font-weight:600; font-size:.74rem; color:var(--muted)}
  .st{font-size:.68rem; font-weight:700; border-radius:999px; padding:1px 8px; margin-inline-start:6px; white-space:nowrap}
  .st-paid{background:var(--ok-soft); color:var(--ok); border:1px solid var(--ok-line)}
  .st-scheduled{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold-line)}
  .st-at-property{background:var(--b-soft); color:var(--b); border:1px solid var(--b-line)}
  .st-booked{background:var(--card-2); color:var(--muted); border:1px solid var(--line-2)}
  .flag{color:var(--warn); font-weight:700}

  .daygroup{display:flex; align-items:baseline; gap:10px; margin:26px 2px 12px; padding-bottom:8px;
    border-bottom:1px solid var(--line)}
  .daygroup:first-of-type{margin-top:6px}
  .dg-date{font-weight:800; color:var(--a); font-size:.95rem; white-space:nowrap}
  .dg-title{color:var(--muted); font-size:.83rem}
  .place{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow)}
  .pl-h{display:flex; align-items:center; gap:12px}
  .pl-ico{font-size:1.5rem; flex:0 0 auto}
  .pl-t h3{margin:0; font-size:1.08rem}
  .pl-he{color:var(--muted); font-size:.82rem}
  .pl-tags{display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 11px}
  .ptag{font-size:.72rem; background:var(--b-soft); border:1px solid var(--b-line); color:var(--b);
    border-radius:999px; padding:2px 10px; font-weight:700}
  .pl-story{margin:0 0 11px; font-size:.92rem; color:var(--ink-2); line-height:1.72}
  .pl-facts{list-style:none; margin:0; padding:0; display:grid; gap:7px}
  .pl-facts li{position:relative; padding:0 20px 0 0; font-size:.88rem; color:var(--ink-2)}
  .pl-facts li::before{content:"◆"; position:absolute; right:2px; top:1px; color:var(--gold); font-size:.62rem}
  .pl-know{margin-top:12px; background:var(--gold-soft); border:1px solid var(--gold-line);
    border-radius:11px; padding:10px 13px; font-size:.86rem; color:var(--ink-2)}
  .pl-know b{color:var(--gold)}

  /* flights */
  .flight{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px 17px; margin-bottom:12px; box-shadow:var(--shadow)}
  .fl-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:13px}
  .fl-no{font-weight:800; font-size:1.05rem; color:var(--a); background:var(--a-soft);
    border:1px solid var(--a-line); border-radius:8px; padding:2px 10px}
  .fl-air{font-size:.85rem; color:var(--ink-2)}
  .fl-op{color:var(--gold); font-weight:700}
  .fl-date{margin-inline-start:auto; font-size:.8rem; color:var(--muted)}
  .fl-route{display:flex; align-items:center; gap:12px}
  .fl-end{flex:0 0 auto; min-width:92px}
  .fl-code{font-size:1.5rem; font-weight:800; letter-spacing:-.02em; line-height:1.1}
  .fl-time{font-size:1rem; font-weight:700; color:var(--b)}
  .fl-meta{font-size:.74rem; color:var(--muted); margin-top:3px; line-height:1.45}
  .fl-mid{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0}
  .fl-dur{font-size:.75rem; color:var(--muted); white-space:nowrap}
  .fl-line{width:100%; height:1px;
    background:linear-gradient(90deg,transparent,var(--line-2) 15%,var(--line-2) 85%,transparent); position:relative}
  .fl-line::after{content:"✈"; position:absolute; left:50%; top:-9px; transform:translateX(-50%) scaleX(-1);
    background:var(--card); padding:0 6px; color:var(--a); font-size:.8rem}
  .fl-rows{display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:13px; padding-top:12px;
    border-top:1px solid var(--line); font-size:.83rem; color:var(--ink-2)}
  .fl-rows b{color:var(--muted); font-weight:600; margin-inline-end:5px}
  .flight .hl{margin:11px 0 0}
  .layover{background:var(--card-2); border:1px dashed var(--line-2); border-radius:13px;
    padding:12px 16px; margin-bottom:12px}
  .lay-h{font-size:.9rem; margin-bottom:5px}
  .lay-h b{color:var(--gold)}
  .layover p{margin:0; font-size:.85rem; color:var(--ink-2)}
  .lay-warn{margin-top:9px; background:var(--warn-soft); border:1px solid var(--warn-line);
    border-radius:10px; padding:9px 12px; font-size:.84rem; color:var(--ink-2)}

  /* emergency */
  .sos{display:flex; align-items:center; gap:16px; background:var(--warn-soft);
    border:2px solid var(--warn-line); border-radius:16px; padding:16px 18px; margin-bottom:18px}
  .sos .num{font-size:2.3rem; font-weight:900; color:var(--warn); letter-spacing:-.02em; text-decoration:none}
  .sos p{margin:0; font-size:.85rem; color:var(--ink-2)}
  .tel{display:inline-flex; align-items:center; gap:5px; text-decoration:none; font-weight:700;
    background:var(--card-2); border:1px solid var(--line-2); border-radius:9px;
    padding:6px 11px; color:var(--b); font-size:.85rem; min-height:38px; direction:ltr}
  .tel:hover{background:var(--b); color:var(--bg)}

  .empty{color:var(--muted); text-align:center; padding:40px 10px; font-size:.9rem}
  footer{max-width:980px; margin:0 auto; color:var(--muted); font-size:.76rem;
    padding:0 14px calc(40px + env(safe-area-inset-bottom,0px))}
  [hidden]{display:none !important}

  @media(max-width:560px){
    header.top h1{font-size:1.2rem}
    .top-in{padding-inline-start:104px}
    .hero img{height:190px}
  }
  @media(min-width:620px){ .hot ul{grid-template-columns:1fr 1fr} }
  @media(min-width:768px){ .hero img{height:260px} }

  /* iPad and desktop: the single 980px column wastes a wide screen */
  @media(min-width:1024px){
    main{max-width:1180px; display:grid; grid-template-columns:270px 1fr; gap:22px; align-items:start}
    main > *{grid-column:1 / -1}
    .hero img{height:320px}
    body.split main > #sideDays{grid-column:1; grid-row:1 / span 2; display:block}
    body.split main > #view{grid-column:2; grid-row:1}
    body.split main > .pager{grid-column:2; grid-row:2}
    body.split nav.days{display:none}
    #sideDays{display:none; position:sticky; top:14px}
    .sidelist{list-style:none; margin:0; padding:0; display:grid; gap:5px}
    .sidelist-btn{display:flex; align-items:center; gap:9px; width:100%; text-align:right;
      background:var(--card); border:1px solid var(--line); border-radius:11px; padding:9px 12px;
      color:var(--ink-2); font-family:inherit; font-size:.86rem; cursor:pointer}
    .sidelist-btn .sd{font-weight:800; color:var(--ink); min-width:26px}
    .sidelist-btn .sw{margin-inline-start:auto; font-size:.75rem; color:var(--gold); font-weight:700}
    .sidelist-btn[aria-selected="true"]{background:var(--a-soft); border-color:var(--a-line); color:var(--a)}
    .sidelist-btn.today .sd::after{content:" ●"; color:var(--b); font-size:.7em; vertical-align:middle}
  }
  @media(prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto} }

  /* ---------- print / PDF backup ---------- */
  @media print{
    .topbtns,.drawer,.scrim,nav.days,.pager,#sideDays,.dayacts,.maprow,.strip,footer{display:none !important}
    body{background:#fff; color:#000; padding:0}
    header.top{background:#fff; border-bottom:2px solid #000; padding:0 0 8px}
    header.top h1,header.top p,.top-facts{color:#000}
    main{max-width:none; display:block; padding:0}
    #view{display:none}
    #printable{display:block !important}
    .p-day{page-break-inside:avoid; break-inside:avoid; border-bottom:1px solid #999;
      padding:10px 0; margin:0}
    .p-day h3{margin:0 0 4px; font-size:13pt}
    .p-day .p-meta{font-size:9pt; color:#444; margin:0 0 6px}
    .p-day ul{margin:0; padding-inline-start:16px; font-size:10pt}
    .p-sec{page-break-before:always}
    .p-sec h2{font-size:14pt; border-bottom:2px solid #000; padding-bottom:3px}
    a{color:#000; text-decoration:none}
  }
  #printable{display:none}
</style>
</head>
<body>
<a href="#view" class="skip">דלג לתוכן</a>

<div class="topbtns">
  <button class="logo" id="logoBtn" aria-label="פתח תפריט" aria-expanded="false" aria-controls="drawer">🏜️</button>
  <button class="iconbtn" id="themeBtn" aria-label="החלף בין מצב כהה לבהיר" title="מצב תצוגה">🌗</button>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-h">
    <b>🏜️ Grand Circle 2026</b>
    <span>5–20 באוגוסט · איתי ורותם</span>
  </div>
  <nav aria-label="ניווט ראשי">
    <button class="mitem" data-view="itinerary"><span class="ic">🗺️</span> המסלול</button>
    <button class="mitem" data-view="tasks"><span class="ic">📝</span> משימות פתוחות <span class="ct" id="ctTasks">–</span></button>
    <button class="mitem" data-view="flights"><span class="ic">✈️</span> טיסות <span class="ct" id="ctFlights">–</span></button>
    <button class="mitem" data-view="emergency"><span class="ic">🆘</span> חירום ומידע חיוני</button>
    <button class="mitem" data-view="places"><span class="ic">📖</span> רקע על האתרים <span class="ct" id="ctPlaces">–</span></button>
    <button class="mitem" data-view="clothing"><span class="ic">🎒</span> מה ללבוש</button>
    <button class="mitem" data-view="packing"><span class="ic">🧳</span> ציוד לארוז <span class="ct" id="ctPack">–</span></button>
    <button class="mitem" data-view="expenses"><span class="ic">💳</span> הוצאות <span class="ct" id="ctExp">–</span></button>
  </nav>
  <div class="drawer-tools">
    <button class="mitem" id="routeBtn"><span class="ic">🗺️</span> מפת כל המסלול</button>
    <button class="mitem" id="shareBtn"><span class="ic">📤</span> שתף את האתר</button>
    <button class="mitem" id="printBtn"><span class="ic">🖨️</span> הדפס / שמור PDF</button>
  </div>
  <div class="drawer-f" id="drawerFoot">טוען נתונים…</div>
</aside>

<header class="top"><div class="top-in">
  <h1 id="tripTitle">🚗 Yosemite ו‑Grand Circle</h1>
  <p id="tripSub"></p>
  <div class="top-facts" id="tripFacts"></div>
</div></header>

<nav class="days" id="daysNav" aria-label="ניווט בין ימי הטיול" hidden>
  <div class="days-in" role="tablist" id="daytabs"></div>
</nav>

<main>
  <aside id="sideDays" aria-label="ימי הטיול"><ul class="sidelist" id="sidelist"></ul></aside>
  <div id="view" tabindex="-1" aria-live="polite"><p class="empty">טוען…</p></div>
  <div class="pager" id="pager" hidden>
    <button id="prevBtn" type="button"><span class="ar" aria-hidden="true">►</span><span>היום הקודם</span></button>
    <button id="nextBtn" type="button"><span>היום הבא</span><span class="ar" aria-hidden="true">◄</span></button>
  </div>
</main>
<div id="printable"></div>
<footer id="foot"></footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view = $("#view"), tabs = $("#daytabs"), pager = $("#pager"), daysNav = $("#daysNav");

let DATA = { days: [], trip: {} };
let TASKS = null, EXPENSES = null, PACKING = null, PLACES = null, FLIGHTS = null, SOS = null, WX = null;
let cur = 0, currentView = "itinerary";

/* ---------------- theme ---------------- */
/* Dark reads well indoors and at night; in direct desert sun it does not.
   Stored preference wins, otherwise follow the device. */
const media = window.matchMedia("(prefers-color-scheme: light)");
function applyTheme(){
  const pref = localStorage.getItem("tripTheme") || "auto";
  const eff = pref === "auto" ? (media.matches ? "light" : "dark") : pref;
  document.documentElement.setAttribute("data-theme", eff);
  $("#themeBtn").textContent = pref === "auto" ? "🌗" : (eff === "light" ? "☀️" : "🌙");
  $("#themeBtn").title = "מצב תצוגה: " + ({auto:"אוטומטי", light:"בהיר", dark:"כהה"}[pref]);
}
$("#themeBtn").addEventListener("click", () => {
  const order = ["auto", "light", "dark"];
  const next = order[(order.indexOf(localStorage.getItem("tripTheme") || "auto") + 1) % 3];
  localStorage.setItem("tripTheme", next);
  applyTheme();
});
media.addEventListener("change", applyTheme);
applyTheme();

/* ---------------- drawer ---------------- */
const drawer = $("#drawer"), scrim = $("#scrim"), logoBtn = $("#logoBtn");
function setDrawer(open){
  drawer.classList.toggle("on", open);
  scrim.classList.toggle("on", open);
  drawer.setAttribute("aria-hidden", open ? "false" : "true");
  logoBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) drawer.querySelector(".mitem").focus();
}
logoBtn.addEventListener("click", () => setDrawer(!drawer.classList.contains("on")));
scrim.addEventListener("click", () => setDrawer(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
document.querySelectorAll(".mitem[data-view]").forEach(b =>
  b.addEventListener("click", () => { show(b.dataset.view); setDrawer(false); }));

/* ---------------- maps ---------------- */
/* Links, not embeds. The old iframes were heavy, swallowed touch scrolling and
   showed nothing without a connection. */
const mapSearch = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const mapNav = q => "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(q) +
  "&travelmode=driving";
function mapRoute(points){
  if (!points.length) return null;
  const enc = encodeURIComponent;
  const origin = enc(points[0]), destination = enc(points[points.length - 1]);
  const way = points.slice(1, -1).slice(0, 9).map(enc).join("%7C");
  return "https://www.google.com/maps/dir/?api=1&origin=" + origin +
    "&destination=" + destination + (way ? "&waypoints=" + way : "") + "&travelmode=driving";
}

/* ---------------- weather ---------------- */
const WX_CODE = {
  0:["☀️","בהיר"], 1:["🌤️","בהיר בעיקר"], 2:["⛅","מעונן חלקית"], 3:["☁️","מעונן"],
  45:["🌫️","ערפל"], 48:["🌫️","ערפל"], 51:["🌦️","טפטוף קל"], 53:["🌦️","טפטוף"], 55:["🌦️","טפטוף חזק"],
  61:["🌧️","גשם קל"], 63:["🌧️","גשם"], 65:["🌧️","גשם חזק"],
  80:["🌦️","ממטרים"], 81:["🌦️","ממטרים"], 82:["⛈️","ממטרים עזים"],
  95:["⛈️","סופת רעמים"], 96:["⛈️","סופת רעמים"], 99:["⛈️","סופת רעמים"]
};
const wxIcon = c => WX_CODE[c] || ["🌡️", ""];

function forecastWindow(days){
  const horizon = new Date(Date.now() + 15 * 864e5).toISOString().slice(0, 10);
  const today = new Date().toISOString().slice(0, 10);
  const from = days[0].iso < today ? today : days[0].iso;
  const last = days[days.length - 1].iso;
  const to = last > horizon ? horizon : last;
  return to < from ? null : { from, to };
}

async function loadWeather(days){
  const win = forecastWindow(days);
  if (!win) return {};
  const lat = days.map(d => d.lat).join(","), lon = days.map(d => d.lon).join(",");
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code" +
    "&timezone=auto&start_date=" + win.from + "&end_date=" + win.to;
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather " + res.status);
  const json = await res.json();
  const list = Array.isArray(json) ? json : [json];
  const out = {};
  days.forEach((day, i) => {
    const daily = list[i] && list[i].daily;
    if (!daily) return;
    const idx = daily.time.indexOf(day.iso);
    if (idx < 0) return;
    out[day.iso] = {
      max: Math.round(daily.temperature_2m_max[idx]),
      min: Math.round(daily.temperature_2m_min[idx]),
      rain: daily.precipitation_probability_max ? daily.precipitation_probability_max[idx] : null,
      code: daily.weather_code[idx],
      live: true
    };
  });
  return out;
}

/* Keep the last successful pull so a day in a canyon still shows a real
   forecast rather than dropping back to a long-term average. */
function cacheWx(wx){
  try { localStorage.setItem("tripWx", JSON.stringify({ at: Date.now(), wx })); } catch (e) {}
}
function cachedWx(){
  try {
    const raw = JSON.parse(localStorage.getItem("tripWx") || "null");
    if (!raw || Date.now() - raw.at > 7 * 864e5) return null;
    Object.values(raw.wx).forEach(w => { w.live = false; w.cached = true; });
    return { wx: raw.wx, at: raw.at };
  } catch (e) { return null; }
}
function wxFor(day){
  const w = WX && WX[day.iso];
  if (w) return w;
  return { max: day.climate.max, min: day.climate.min, rain: null, code: null, live: false };
}
const wxSource = w => w.live ? "תחזית" : (w.cached ? "תחזית שמורה" : "ממוצע רב‑שנתי לאוגוסט");

/* ---------------- clock helpers ---------------- */
const TEXT_HOUR = { "זריחה":6, "בוקר מוקדם":7, "מוקדם":7, "בוקר":9, "צהריים":13,
  "אחה\"צ":16, "שקיעה":19.5, "ערב":20, "לילה":22, "לינה":22, "חלופות":16, "חלופה":13 };
function stopHour(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})/);
  if (m) return +m[1] + (+m[2]) / 60;
  for (const k in TEXT_HOUR) if (String(t).includes(k)) return TEXT_HOUR[k];
  return null;
}
const todayIso = () => new Date().toISOString().slice(0, 10);
function daysUntil(iso){
  const a = new Date(todayIso() + "T00:00:00"), b = new Date(iso + "T00:00:00");
  return Math.round((b - a) / 864e5);
}
/* index of the stop happening now, and of the one after it */
function nowMarkers(day){
  if (day.iso !== todayIso()) return {};
  const hour = new Date().getHours() + new Date().getMinutes() / 60;
  let now = -1;
  day.stops.forEach((s, i) => { const h = stopHour(s.t); if (h != null && h <= hour) now = i; });
  const next = day.stops.findIndex((s, i) => i > now && stopHour(s.t) != null);
  return { now, next };
}

/* ---------------- money ---------------- */
const SYM = { USD: "$", ILS: "₪", EUR: "€" };
const money = (n, c) => (SYM[c] || (c + " ")) + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function toBase(item){
  const rate = (EXPENSES.rates && EXPENSES.rates[item.currency]) || 1;
  return item.amount == null ? null : item.amount * rate;
}

/* ---------------- itinerary ---------------- */
function heroFor(day){
  const src = day.img || ("images/day-" + day.iso + ".svg");
  const sleep = day.sleep
    ? `<span class="badge ${day.sleep.st === "ok" ? "ok" : "warn"}">🛏️ ${esc(day.sleep.name)} ${day.sleep.st === "ok" ? "✅" : "— לא הוזמן ⚠️"}</span>` : "";
  const drive = day.drive ? `<span class="badge">🚗 ${esc(day.drive)}</span>` : "";
  return `<div class="hero">
    <img src="${esc(src)}" alt="${esc(day.imgAlt || "")}" loading="lazy" decoding="async">
    <div class="hero-txt"><h2>${esc(day.date)} · ${esc(day.title)}</h2>
      <div class="badges">${drive}${sleep}</div></div></div>`;
}

function renderDay(day){
  const w = wxFor(day), ic = wxIcon(w.code), mark = nowMarkers(day);
  let html = "";

  if (!navigator.onLine)
    html += `<div class="strip off">📴 <span>אין חיבור לרשת — מוצג המידע השמור במכשיר.</span></div>`;
  const left = daysUntil(DATA.days[0].iso);
  if (left > 0 && day.iso === DATA.days[0].iso)
    html += `<div class="strip count">🗓️ <span>עוד <b>${left}</b> ${left === 1 ? "יום" : "ימים"} ליציאה.</span></div>`;

  html += heroFor(day);

  html += `<div class="wxbar${w.live ? "" : " est"}">
      <span class="big">${ic[0]}</span>
      <span class="t">${w.max}°<small> / ${w.min}°</small></span>
      <span class="lbl">${esc(ic[1])}${w.rain != null && w.rain >= 20 ? " · " + w.rain + "% משקעים" : ""}</span>
      <span class="meta">${esc(day.place)} · ${wxSource(w)}</span>
    </div>`;

  const pts = day.stops.map(s => s.m).filter(Boolean);
  const route = mapRoute(pts);
  html += `<div class="dayacts">
      ${route ? `<a class="mbtn go" href="${route}" target="_blank" rel="noopener">🧭 מסלול היום ב‑Maps</a>` : ""}
      ${day.sleep ? `<a class="mbtn" href="${mapNav(day.sleep.name)}" target="_blank" rel="noopener">🛏️ נווט ללינה</a>` : ""}
    </div>`;

  if (day.hot && day.hot.length)
    html += `<div class="hot"><h3>🔥 המלצות חמות ליום</h3><ul>${day.hot.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>`;

  day.stops.forEach((s, i) => {
    const bk = s.booked ? ' <span class="bk">✅ מוזמן</span>'
      : (s.st === "warn" ? ' <span class="bk" style="color:var(--warn)">⚠️</span>' : "");
    const tag = i === mark.now ? '<span class="nowtag is-now">עכשיו</span>'
      : (i === mark.next ? '<span class="nowtag is-next">הבא</span>' : "");
    const cls = i === mark.now ? " now" : (i === mark.next ? " next" : "");
    const hls = (s.hl || []).map(h => `<li>${esc(h)}</li>`).join("");
    html += `<article class="stop${cls}"><div class="stop-top">
      <div class="stop-ico" aria-hidden="true">${s.i}</div>
      <div class="stop-main">
        <span class="stop-time">${esc(s.t)}</span>${tag}
        <h3 class="stop-name">${esc(s.n)}${bk}</h3>
        <p class="stop-desc">${esc(s.d)}</p>
        ${hls ? `<ul class="hl">${hls}</ul>` : ""}
        ${s.m ? `<div class="maprow"><span class="pin">📍</span>
          <span class="place">${esc(s.m)}</span>
          <a class="mbtn go" href="${mapNav(s.m)}" target="_blank" rel="noopener">🧭 נווט</a>
          <a class="mbtn" href="${mapSearch(s.m)}" target="_blank" rel="noopener">מפה</a></div>` : ""}
      </div></div></article>`;
  });
  if (day.food) html += `<div class="food">🍽️ ${day.food}</div>`;
  if (day.tip)  html += `<div class="tip">💡 ${day.tip}</div>`;
  view.innerHTML = html;
}

function selectDay(idx, keepFocus){
  cur = idx;
  document.querySelectorAll(".daytab").forEach((t, i) => {
    const sel = i === idx;
    t.setAttribute("aria-selected", sel ? "true" : "false");
    t.setAttribute("tabindex", sel ? "0" : "-1");
    if (sel && keepFocus) t.focus();
    if (sel) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
  document.querySelectorAll(".sidelist-btn").forEach((b, i) =>
    b.setAttribute("aria-selected", i === idx ? "true" : "false"));
  renderDay(DATA.days[idx]);
  $("#prevBtn").disabled = idx === 0;
  $("#nextBtn").disabled = idx === DATA.days.length - 1;
}

function clothingFor(day){
  const w = wxFor(day), items = [], key = [];
  const max = w.max, min = w.min;
  if (max >= 38)      key.push("👕 בגדים קלילים ונושמים בלבד");
  else if (max >= 32) key.push("👕 חולצה קצרה + מכנס קצר");
  else if (max >= 24) key.push("👕 חולצה קצרה");
  else                key.push("👔 שכבה ארוכה ליום");
  if (min <= 10)      key.push("🧥 פליז או ג'קט חם לערב");
  else if (min <= 16) key.push("🧥 שכבה חמה לערב");
  else if (min >= 25) items.push("🌙 גם בלילה חם — אין צורך בשכבה");
  if (max >= 30) items.push("🧢 כובע", "🕶️ משקפי שמש", "🧴 קרם הגנה 50", "💧 2–3 ליטר מים לאדם");
  else items.push("🧢 כובע", "🕶️ משקפי שמש", "🧴 קרם הגנה");
  switch (day.kind){
    case "hike-alpine":
      key.push("🥾 נעלי הליכה");
      items.push("🧣 שכבת ביניים — בגובה קר גם בקיץ", "🎒 תיק יום", "🧤 כפפות דקות לזריחה/ערב"); break;
    case "hike-hot":
      key.push("🥾 נעלי הליכה");
      items.push("🌅 לצאת עם שחר — אחרי 10:00 קשה", "🩳 בגד ים לבריכה", "🧊 מים קפואים מראש"); break;
    case "water":
      key.push("🩴 נעלי מים (להשכיר בספרינגדייל)", "🩱 בגד ים מתחת לבגדים");
      items.push("👖 בגדים מתייבשים מהר — לא כותנה", "🥢 מקל הליכה לזרם",
                 "🎒 שק אטום לטלפון ולמצלמה", "🧦 גרבי נאופרן — המים קרים"); break;
    case "water-desert":
      key.push("🩱 בגד ים", "🥾 נעליים סגורות לקניון");
      items.push("🏖️ מגבת", "🎒 תיק קטן — בקניון אין מקום למזוודות", "📷 מצלמה — האור בקניון דרמטי"); break;
    case "desert-dust":
      key.push("🧣 באף/מטפחת לאבק");
      items.push("👖 בגדים כהים — אבק אדום נדבק לבהיר", "😷 חלון סגור בלולאת העפר", "🧼 מגבונים ברכב"); break;
    case "drive-city":
      key.push("👗 בגד ערב למסעדה");
      items.push("👟 נעליים נוחות להליכה בסטריפ", "🧥 שכבה דקה — מיזוג עוצמתי בפנים"); break;
    case "drive": case "drive-rim":
      items.push("👟 נעליים נוחות", "🧥 שכבה דקה לנהיגה עם מיזוג", "🍎 חטיפים ומים ברכב"); break;
    case "travel":
      key.push("🧥 שכבה לטיסה — קר במטוס");
      items.push("👟 נעליים נוחות", "🎧 אוזניות", "💊 תיק קטן עם המוצרים החיוניים"); break;
    case "city-walk":
      key.push("👟 נעליים נוחות מאוד — הרבה קילומטרים על אספלט");
      items.push("🧥 שכבה דקה — המיזוג בפנים אגרסיבי", "🎒 תיק קטן ולא תיק גב",
                 "💳 כרטיס אשראי אחד קבוע ל‑OMNY", "🧴 דאודורנט — אוגוסט בעיר לח מאוד"); break;
  }
  if (w.rain != null && w.rain >= 30) items.push("🌧️ מעיל גשם קל — " + w.rain + "% סיכוי למשקעים");
  if (day.iso === "2026-08-10") items.push("🌌 שכבה חמה לצפייה בכוכבים — Bryce קפוא בלילה");
  return { key, items, w };
}

function renderPacking(){
  if (!PACKING) return `<p class="empty">לא נטענה רשימת הציוד.</p>`;
  const saved = JSON.parse(localStorage.getItem("tripPacking") || "{}");
  const total = PACKING.sections.reduce((a, s) => a + s.items.length, 0);
  const packed = PACKING.sections.reduce((a, s) => a + s.items.filter(i => saved[i.id]).length, 0);
  let html = `<div class="page-h"><h2>🧳 ציוד לארוז</h2><p>${esc(PACKING.intro)}</p></div>`;
  html += `<div class="progress"><div class="pbar"><span style="width:${total ? (packed / total * 100) : 0}%"></span></div>
    <div class="pnum">${packed} / ${total}</div></div>`;
  html += `<div class="plan">` + PACKING.plan.map(p =>
    `<div class="pcard"><b>${p.icon} ${esc(p.t)}</b><span>${esc(p.d)}</span></div>`).join("") + `</div>`;
  PACKING.sections.forEach(sec => {
    const n = sec.items.filter(i => saved[i.id]).length;
    html += `<div class="sec"><h3>${sec.icon} ${esc(sec.title)}
      <span class="tag ${n === sec.items.length ? "t-done" : "t-optional"}">${n}/${sec.items.length}</span>
      <span class="secnote">${esc(sec.note)}</span></h3>`;
    sec.items.forEach(i => {
      const on = !!saved[i.id];
      html += `<label class="task${on ? " checked" : ""}">
        <input type="checkbox" data-pack="${esc(i.id)}"${on ? " checked" : ""}>
        <span class="txt"><b>${esc(i.n)}${i.q ? ` <span class="qty">${esc(i.q)}</span>` : ""}</b>
        ${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</span></label>`;
    });

    html += `<div class="exp"><div class="m"><b>${esc(s.n)}</b><span class="note">${esc(s.why)}</span></div></div>`;
  });

function renderExpenses(){
  if (!EXPENSES) return `<p class="empty">לא נטענו הוצאות.</p>`;
  const CATS = { flights: "✈️ טיסות", car: "🚗 רכב", hotels: "🛏️ לינה", tours: "🎟️ סיורים" };
  const stLabel = { paid: "שולם", scheduled: "חיוב עתידי", "at-property": "תשלום במקום", booked: "מוזמן" };
  let sure = 0, flagged = 0, unknown = 0;
  EXPENSES.items.forEach(it => {
    const v = toBase(it);
    if (v == null) { unknown++; return; }
    if (it.uncertain) flagged += v; else sure += v;
  });
  let html = `<div class="page-h"><h2>💳 הוצאות הטיול</h2>
    <p>${esc(EXPENSES.source)} · עודכן ${esc(EXPENSES.updated)}</p></div>`;
  if (EXPENSES.note) html += `<div class="banner">ℹ️ ${esc(EXPENSES.note)}</div>`;
  html += `<div class="totals">
    <div class="tot main"><div class="k">סה״כ עד כה</div><div class="v">${money(sure, "USD")}</div></div>
    ${flagged ? `<div class="tot"><div class="k">כולל פריטים לאימות</div><div class="v">${money(sure + flagged, "USD")}</div></div>` : ""}
    ${unknown ? `<div class="tot"><div class="k">חסרי סכום</div><div class="v">${unknown}</div></div>` : ""}
    <div class="tot"><div class="k">פריטים</div><div class="v">${EXPENSES.items.length}</div></div>
  </div>`;
  Object.keys(CATS).forEach(cat => {
    const rows = EXPENSES.items.filter(i => i.cat === cat);
    if (!rows.length) return;
    const sum = rows.reduce((a, i) => a + (toBase(i) || 0), 0);
    html += `<div class="sec"><h3>${CATS[cat]} <span class="tag t-optional">${money(sum, "USD")}</span></h3>`;
    rows.forEach(i => {
      const base = toBase(i);
      const native = i.amount == null ? "—" : money(i.amount, i.currency);
      const conv = (base != null && i.currency !== "USD") ? `<span class="sub">≈ ${money(base, "USD")}</span>` : "";
      html += `<div class="exp">
        <div class="m"><b>${i.uncertain ? '<span class="flag">⚠️ </span>' : ""}${esc(i.label)}</b>
          <span class="st st-${esc(i.status)}">${esc(stLabel[i.status] || i.status)}</span>
          ${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</div>
        <div class="amt">${native}${conv}</div></div>`;
    });
    html += `</div>`;
  });
  html += `<div class="sec"><h3>🔒 פיקדונות מוחזרים <span class="tag t-optional">לא נספר בסה״כ</span></h3>`;
  EXPENSES.deposits.forEach(d => {
    html += `<div class="exp"><div class="m"><b>${esc(d.label)}</b><span class="note">${esc(d.note)}</span></div>
      <div class="amt">${money(d.amount, d.currency)}</div></div>`;
  });
  html += `</div><div class="sec"><h3>⏳ עדיין לא שולם <span class="tag t-soon">${EXPENSES.missing.length}</span></h3>`;
  EXPENSES.missing.forEach(m => {
    html += `<div class="exp"><div class="m"><b>${esc(m.label)}</b><span class="note">${esc(m.note)}</span></div></div>`;
  });
  return html + `</div>`;
}

  $("#printable").innerHTML = h;

/* ---------------- view switching ---------------- */
function show(name){
  currentView = name;
  document.querySelectorAll(".mitem[data-view]").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === name ? "page" : "false"));
  const isItin = name === "itinerary";
  daysNav.hidden = !isItin;
  pager.hidden = !isItin;
  document.body.classList.toggle("split", isItin);
  if (isItin) selectDay(cur);
  else view.innerHTML = name === "tasks" ? renderTasks()
                      : name === "flights" ? renderFlights()
                      : name === "emergency" ? renderEmergency()
                      : name === "places" ? renderPlaces()
                      : name === "clothing" ? renderClothing()
                      : name === "packing" ? renderPacking()
                      : renderExpenses();
  view.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "instant" });
}

function persist(key, id, on){
  const saved = JSON.parse(localStorage.getItem(key) || "{}");
  saved[id] = on;
  localStorage.setItem(key, JSON.stringify(saved));
}
view.addEventListener("change", e => {
  const cb = e.target.closest("input[data-task],input[data-pack]");
  if (!cb) return;
  cb.closest(".task").classList.toggle("checked", cb.checked);
  if (cb.dataset.task) persist("tripTasks", cb.dataset.task, cb.checked);
  else {
    persist("tripPacking", cb.dataset.pack, cb.checked);
    const y = window.scrollY;
    view.innerHTML = renderPacking();
    window.scrollTo({ top: y, behavior: "instant" });
  }
});

/* ---------------- drawer tools ---------------- */
$("#routeBtn").addEventListener("click", () => {
  const stays = DATA.days.map(d => d.sleep && d.sleep.name).filter(Boolean);
  const url = mapRoute([...new Set(stays)]);
  if (url) window.open(url, "_blank", "noopener");
  setDrawer(false);
});
$("#shareBtn").addEventListener("click", async () => {
  const data = { title: "Grand Circle 2026", text: "המסלול שלנו לאוגוסט", url: location.href };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(location.href); alert("הקישור הועתק"); }
  } catch (e) { /* cancelled */ }
  setDrawer(false);
});
$("#printBtn").addEventListener("click", () => {
  buildPrintable();
  setDrawer(false);
  setTimeout(() => window.print(), 120);
});

window.addEventListener("online", () => { if (currentView === "itinerary") selectDay(cur); });
window.addEventListener("offline", () => { if (currentView === "itinerary") selectDay(cur); });

/* ---------------- boot ---------------- */
async function boot(){
  const grab = u => fetch(u).then(r => r.json()).catch(() => null);
  try {
    const [d, t, e, p, pl, fl, sos] = await Promise.all([
      fetch("data/days.json").then(r => r.json()),
      grab("data/tasks.json"), grab("data/expenses.json"), grab("data/packing.json"),
      grab("data/places.json"), grab("data/flights.json"), grab("data/emergency.json")
    ]);
    DATA = d; TASKS = t; EXPENSES = e; PACKING = p; PLACES = pl; FLIGHTS = fl; SOS = sos;
  } catch (err) {
    view.innerHTML = `<p class="empty">לא הצלחתי לטעון את נתוני הטיול.<br>${esc(err.message)}</p>`;
    return;
  }

  $("#tripTitle").textContent = "🚗 " + DATA.trip.title;
  $("#tripSub").textContent = DATA.trip.subtitle;
  $("#tripFacts").innerHTML = DATA.trip.facts.map(f => `<span>${esc(f)}</span>`).join("");
  $("#ctTasks").textContent = TASKS ? TASKS.open.length : "–";
  $("#ctExp").textContent = EXPENSES ? EXPENSES.items.length : "–";
  $("#ctPlaces").textContent = PLACES ? PLACES.places.length : "–";
  $("#ctPack").textContent = PACKING ? PACKING.sections.reduce((a, s) => a + s.items.length, 0) : "–";
  $("#ctFlights").textContent = FLIGHTS
    ? FLIGHTS.legs.reduce((a, l) => a + l.items.filter(i => i.type === "flight").length, 0) : "–";
  $("#foot").textContent = "זמני נהיגה ומרחקים הם הערכות — לאשר שעות פתיחה, הזמנות והיתרים סמוך לתאריך. " +
    "תחזית מ‑Open‑Meteo, ניווט נפתח ב‑Google Maps.";

  const today = todayIso();
  const side = $("#sidelist");
  DATA.days.forEach((day, idx) => {
    const isToday = day.iso === today;
    const b = document.createElement("button");
    b.className = "daytab" + (isToday ? " today" : "");
    b.setAttribute("role", "tab"); b.id = "tab-" + idx; b.setAttribute("aria-controls", "view");
    b.innerHTML = esc(day.date.replace(" באוג'", "")) + "<small>" + esc(day.dow) + "</small>"
      + `<span class="wx est">~${day.climate.max}°</span>`;
    b.addEventListener("click", () => selectDay(idx));
    b.addEventListener("keydown", ev => {
      if (ev.key === "ArrowLeft"){ ev.preventDefault(); selectDay(Math.min(cur + 1, DATA.days.length - 1), true); }
      if (ev.key === "ArrowRight"){ ev.preventDefault(); selectDay(Math.max(cur - 1, 0), true); }
    });
    tabs.appendChild(b);

    const li = document.createElement("li");
    const sb = document.createElement("button");
    sb.className = "sidelist-btn" + (isToday ? " today" : "");
    sb.innerHTML = `<span class="sd">${esc(day.date.replace(" באוג'", ""))}</span>
      <span>${esc(day.title)}</span><span class="sw" id="sw-${idx}">~${day.climate.max}°</span>`;
    sb.addEventListener("click", () => selectDay(idx));
    li.appendChild(sb); side.appendChild(li);
  });

  $("#prevBtn").addEventListener("click", () => selectDay(Math.max(cur - 1, 0)));
  $("#nextBtn").addEventListener("click", () => selectDay(Math.min(cur + 1, DATA.days.length - 1)));

  const todayIdx = DATA.days.findIndex(d => d.iso === today);
  if (todayIdx >= 0) cur = todayIdx;
  show("itinerary");

  const cached = cachedWx();
  if (cached) { WX = cached.wx; paintWx(); if (currentView === "itinerary") renderDay(DATA.days[cur]); }

  try {
    const fresh = await loadWeather(DATA.days);
    if (Object.keys(fresh).length){
      WX = Object.assign({}, WX, fresh);
      cacheWx(fresh);
      paintWx();
      if (currentView === "itinerary") renderDay(DATA.days[cur]);
      else if (currentView === "clothing") view.innerHTML = renderClothing();
    }
  } catch (err) {
    $("#drawerFoot").textContent = cached
      ? "אין רשת — מוצגת התחזית האחרונה שנשמרה"
      : "תחזית לא זמינה — מוצגים ממוצעים רב‑שנתיים לאוגוסט";
  }
}

function paintWx(){
  let live = 0;
  DATA.days.forEach((day, i) => {
    const w = WX && WX[day.iso];
    if (!w) return;
    if (w.live) live++;
    const el = document.querySelector("#tab-" + i + " .wx");
    if (el){ el.textContent = w.max + "°"; el.classList.toggle("est", !w.live); }
    const sw = document.getElementById("sw-" + i);
    if (sw) sw.textContent = w.max + "°";
  });
  $("#drawerFoot").textContent = live
    ? `תחזית חיה ל‑${live} מתוך ${DATA.days.length} ימים · Open‑Meteo`
    : "מוצגת תחזית שמורה · Open‑Meteo";
}

boot();

/* Offline support. Registered last so a failure here never blocks the page. */
if ("serviceWorker" in navigator) {
  /* An update installs in the background and then claims this page. Without
     reloading, the tab keeps running the markup it was served with — that is
     how a stale layout survived a deploy. Reload once when a *new* worker
     takes over; skip it on the very first visit, when there was no controller
     to replace. */
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener("load", () =>
    navigator.serviceWorker.register("sw.js")
      .then(reg => reg.update())
      .catch(() => {}));
}
</script>
</body>
