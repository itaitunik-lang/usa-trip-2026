<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12100f">
<title>מסלול Yosemite ו‑Grand Circle · אוגוסט 2026</title>
<meta name="description" content="מסלול טיול מפורט: יוסמיטי, זיון, ברייס, פייג', מוניומנט ואלי, גרנד קניון וסדונה — עם מפות, תחזית מזג אוויר, המלצות לבוש והוצאות.">
<style>
  :root{
    --bg:#12100f; --bg-2:#191614; --card:#1d1917; --card-2:#241f1c;
    --ink:#efe8e0; --ink-2:#cfc5ba; --muted:#968b80; --line:#332c27; --line-2:#443a33;
    --a:#e8734a; --a-dim:#3a201704; --a-soft:#2a1a13;
    --b:#4fb9a1; --b-soft:#14282a;
    --gold:#e0a94a; --gold-soft:#2a2114;
    --warn:#f2685f; --warn-soft:#2e1917;
    --ok:#5cc48a; --ok-soft:#152a1f;
    --shadow:0 4px 20px rgba(0,0,0,.45);
    --r:16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{direction:rtl; text-align:right; margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,"Arial Hebrew",sans-serif; line-height:1.6;
    -webkit-font-smoothing:antialiased}
  a{color:var(--b)}
  h1,h2,h3{line-height:1.25}
  .skip{position:absolute; right:-9999px; top:8px; background:var(--a); color:#1a0d07; padding:8px 14px; border-radius:8px; z-index:200; font-weight:700}
  .skip:focus{right:8px}
  .wrap{max-width:980px; margin:0 auto; padding:0 14px}

  /* ---------- header + logo/menu ---------- */
  header.top{position:relative; background:
      radial-gradient(120% 140% at 15% 0%, #7d3a20 0%, transparent 60%),
      linear-gradient(140deg,#3a1c12,#1a1110 70%);
    border-bottom:1px solid var(--line); padding:20px 16px 22px}
  .top-in{max-width:980px; margin:0 auto; padding-inline-start:56px}
  header.top h1{margin:0 0 4px; font-size:1.5rem; letter-spacing:-.01em}
  header.top p{margin:0; color:var(--ink-2); font-size:.9rem}
  .top-facts{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:11px; font-size:.8rem; color:var(--muted)}

  .logo{position:absolute; top:18px; left:16px; z-index:60;
    width:44px; height:44px; border-radius:14px; cursor:pointer;
    background:linear-gradient(145deg,var(--a),#a8401f); border:1px solid #6d2f18;
    color:#1a0d07; font-size:1.3rem; display:grid; place-items:center;
    box-shadow:0 3px 14px rgba(0,0,0,.5)}
  .logo:hover{filter:brightness(1.1)}
  .logo:focus-visible{outline:3px solid var(--b); outline-offset:3px}

  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .22s; z-index:98}
  .scrim.on{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; left:0; height:100%; width:min(310px,86vw); z-index:99;
    background:var(--bg-2); border-inline-end:1px solid var(--line);
    transform:translateX(-102%); transition:transform .24s cubic-bezier(.3,.7,.3,1);
    display:flex; flex-direction:column; box-shadow:14px 0 40px rgba(0,0,0,.5)}
  .drawer.on{transform:translateX(0)}
  .drawer-h{padding:18px 18px 14px; border-bottom:1px solid var(--line)}
  .drawer-h b{display:block; font-size:1.05rem}
  .drawer-h span{color:var(--muted); font-size:.8rem}
  .drawer nav{padding:10px; display:grid; gap:4px}
  .mitem{display:flex; align-items:center; gap:12px; width:100%; text-align:right;
    background:none; border:1px solid transparent; border-radius:11px; padding:12px 13px;
    color:var(--ink); font-size:.96rem; font-weight:600; cursor:pointer; font-family:inherit}
  .mitem:hover{background:var(--card)}
  .mitem[aria-current="page"]{background:var(--a-soft); border-color:#5c2c1a; color:var(--a)}
  .mitem .ic{font-size:1.15rem; width:24px; text-align:center}
  .mitem .ct{margin-inline-start:auto; font-size:.72rem; font-weight:700; color:var(--muted);
    background:var(--card-2); border:1px solid var(--line); border-radius:999px; padding:1px 8px}
  .mitem[aria-current="page"] .ct{color:var(--a); border-color:#5c2c1a; background:#33190f}
  .drawer-f{margin-top:auto; padding:14px 18px; border-top:1px solid var(--line);
    color:var(--muted); font-size:.74rem}

  /* ---------- day tabs ---------- */
  nav.days{position:sticky; top:0; z-index:30; background:rgba(18,16,15,.93);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .days-in{max-width:980px; margin:0 auto; display:flex; gap:6px; overflow-x:auto; padding:10px 12px;
    scrollbar-width:none}
  .days-in::-webkit-scrollbar{display:none}
  .daytab{flex:0 0 auto; border:1px solid var(--line-2); background:var(--card); color:var(--ink-2);
    border-radius:999px; padding:7px 14px; font-size:.85rem; font-weight:700; cursor:pointer;
    white-space:nowrap; min-height:44px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; line-height:1.15; font-family:inherit}
  .daytab small{font-weight:400; color:var(--muted); font-size:.7rem}
  .daytab .wx{font-size:.68rem; color:var(--gold); font-weight:700}
  .daytab[aria-selected="true"]{background:var(--a); border-color:var(--a); color:#1a0d07}
  .daytab[aria-selected="true"] small,.daytab[aria-selected="true"] .wx{color:#3d1a0b}
  .daytab:focus-visible{outline:3px solid var(--b); outline-offset:2px}

  main{max-width:980px; margin:0 auto; padding:16px 14px 44px}

  /* ---------- day content ---------- */
  .dayhead{background:linear-gradient(150deg,var(--a-soft),var(--card));
    border:1px solid #4a2a1c; border-radius:var(--r); padding:16px 18px; margin-bottom:14px}
  .dayhead h2{margin:0 0 9px; font-size:1.22rem; color:#ff9066}
  .badges{display:flex; flex-wrap:wrap; gap:7px}
  .badge{font-size:.76rem; border-radius:999px; padding:4px 11px; border:1px solid var(--line-2);
    background:var(--card-2); color:var(--ink-2)}
  .badge.ok{background:var(--ok-soft); color:var(--ok); border-color:#265c40; font-weight:700}
  .badge.warn{background:var(--warn-soft); color:var(--warn); border-color:#6b2f2a; font-weight:700}

  /* weather strip */
  .wxbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 16px; margin-bottom:14px}
  .wxbar .big{font-size:1.5rem}
  .wxbar .t{font-size:1.15rem; font-weight:800}
  .wxbar .t small{font-size:.85rem; font-weight:600; color:var(--muted)}
  .wxbar .lbl{color:var(--ink-2); font-size:.88rem}
  .wxbar .meta{color:var(--muted); font-size:.78rem; margin-inline-start:auto}
  .wxbar.est{border-style:dashed}

  .hot{background:var(--gold-soft); border:1px solid #5a4520; border-radius:14px; padding:13px 16px; margin-bottom:16px}
  .hot h3{margin:0 0 8px; color:var(--gold); font-size:.98rem}
  .hot ul{margin:0; padding:0; list-style:none; display:grid; gap:6px}
  .hot li{background:var(--card); border:1px solid var(--line-2); border-radius:9px;
    padding:7px 11px; font-size:.87rem; font-weight:600}

  .stop{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow)}
  .stop-top{display:flex; align-items:flex-start; gap:12px}
  .stop-ico{font-size:1.45rem; flex:0 0 auto; line-height:1.4}
  .stop-main{flex:1; min-width:0}
  .stop-time{display:inline-block; font-size:.72rem; font-weight:700; color:var(--b);
    background:var(--b-soft); border:1px solid #235049; border-radius:6px; padding:2px 8px; margin-bottom:5px}
  .stop-name{font-size:1.04rem; font-weight:800; margin:0 0 5px}
  .bk{font-size:.68rem; color:var(--ok); font-weight:700; vertical-align:middle}
  .stop-desc{font-size:.91rem; margin:0 0 8px; color:var(--ink-2)}
  .hl{list-style:none; margin:0 0 10px; padding:0}
  .hl li{position:relative; padding:2px 18px 2px 0; font-size:.87rem; color:var(--ink-2)}
  .hl li::before{content:"◂"; position:absolute; right:2px; color:var(--a); font-size:.7rem; top:5px}
  .mapwrap{border:1px solid var(--line-2); border-radius:10px; overflow:hidden; margin-bottom:8px; background:#000}
  .mapwrap iframe{display:block; width:100%; height:180px; border:0; filter:invert(.92) hue-rotate(180deg) saturate(.75)}
  .maps{display:inline-flex; align-items:center; gap:6px; text-decoration:none; background:transparent;
    border:1.5px solid var(--b); color:var(--b); font-weight:700; font-size:.82rem;
    border-radius:9px; padding:7px 12px; min-height:40px}
  .maps:hover{background:var(--b); color:#0e1f1c}
  .maps:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

  .food,.tip{border-radius:12px; padding:11px 14px; margin-top:12px; font-size:.89rem; color:var(--ink-2)}
  .food{background:var(--b-soft); border:1px solid #235049} .food b{color:var(--b)}
  .tip{background:var(--gold-soft); border:1px solid #5a4520} .tip b{color:var(--gold)}

  .pager{display:flex; justify-content:space-between; gap:10px; margin-top:18px}
  .pager button{flex:1; background:var(--card); border:1.5px solid var(--line-2); border-radius:12px;
    padding:13px; font-size:.9rem; font-weight:700; cursor:pointer; color:var(--ink); min-height:48px; font-family:inherit}
  .pager button:hover:not(:disabled){border-color:var(--a); color:var(--a)}
  .pager button:disabled{opacity:.35; cursor:default}
  .pager button:focus-visible{outline:3px solid var(--b); outline-offset:2px}

  /* ---------- generic page bits ---------- */
  .page-h{margin:4px 0 18px}
  .page-h h2{margin:0 0 4px; font-size:1.4rem}
  .page-h p{margin:0; color:var(--muted); font-size:.86rem}
  .sec{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:6px 18px 14px; margin-bottom:16px}
  .sec h3{font-size:1rem; margin:15px 0 8px; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .tag{font-size:.67rem; font-weight:700; padding:2px 9px; border-radius:999px}
  .t-urgent{background:var(--warn-soft); color:var(--warn); border:1px solid #6b2f2a}
  .t-soon{background:var(--gold-soft); color:var(--gold); border:1px solid #5a4520}
  .t-optional{background:var(--card-2); color:var(--muted); border:1px solid var(--line-2)}

  .task{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task input[type=checkbox]{margin-top:4px; width:18px; height:18px; accent-color:var(--b); flex:none; cursor:pointer}
  .task .txt{flex:1; font-size:.93rem}
  .task .txt b{display:block; font-weight:700}
  .task .note{display:block; color:var(--muted); font-size:.82rem; margin-top:3px}
  .task.checked .txt b{text-decoration:line-through; color:var(--muted)}
  .done-list{list-style:none; margin:0; padding:0}
  .done-list li{padding:8px 0; border-bottom:1px solid var(--line); font-size:.88rem; color:var(--ink-2)}
  .done-list li:last-child{border-bottom:none}
  .done-list li::before{content:"✅ "; }
  .done-list li span{color:var(--muted); font-size:.8rem}

  /* clothing */
  .cday{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 17px; margin-bottom:12px}
  .cday-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px}
  .cday-h b{font-size:1.02rem}
  .cday-h .d{color:var(--muted); font-size:.82rem}
  .cday-h .temp{margin-inline-start:auto; font-weight:800; color:var(--gold); font-size:.95rem}
  .cday .why{color:var(--ink-2); font-size:.87rem; margin:0 0 10px}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:.83rem; background:var(--card-2); border:1px solid var(--line-2);
    border-radius:999px; padding:5px 12px; color:var(--ink-2)}
  .chip.key{background:var(--a-soft); border-color:#5c2c1a; color:#ff9066; font-weight:700}

  /* expenses */
  .totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:18px}
  .tot{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px}
  .tot .k{color:var(--muted); font-size:.78rem; margin-bottom:3px}
  .tot .v{font-size:1.35rem; font-weight:800; letter-spacing:-.02em}
  .tot.main{background:linear-gradient(150deg,var(--a-soft),var(--card)); border-color:#4a2a1c}
  .tot.main .v{color:#ff9066}
  .exp{display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
  .exp:last-child{border-bottom:none}
  .exp .m{flex:1; min-width:0}
  .exp .m b{font-weight:700; font-size:.93rem}
  .exp .m .note{display:block; color:var(--muted); font-size:.81rem; margin-top:3px}
  .exp .amt{text-align:left; flex:0 0 auto; font-weight:800; font-size:.98rem; white-space:nowrap}
  .exp .amt .sub{display:block; font-weight:600; font-size:.74rem; color:var(--muted)}
  .st{font-size:.68rem; font-weight:700; border-radius:999px; padding:1px 8px; margin-inline-start:6px; white-space:nowrap}
  .st-paid{background:var(--ok-soft); color:var(--ok); border:1px solid #265c40}
  .st-scheduled{background:var(--gold-soft); color:var(--gold); border:1px solid #5a4520}
  .st-at-property{background:var(--b-soft); color:var(--b); border:1px solid #235049}
  .st-booked{background:var(--card-2); color:var(--muted); border:1px solid var(--line-2)}
  .flag{color:var(--warn); font-weight:700}

  .empty{color:var(--muted); text-align:center; padding:40px 10px; font-size:.9rem}
  footer{max-width:980px; margin:0 auto; padding:0 14px 40px; color:var(--muted); font-size:.76rem}
  [hidden]{display:none !important}

  @media(max-width:560px){
    header.top h1{font-size:1.2rem}
    .mapwrap iframe{height:160px}
    .top-in{padding-inline-start:52px}
  }
  @media(min-width:620px){ .hot ul{grid-template-columns:1fr 1fr} }
  @media(prefers-reduced-motion:reduce){ *{transition:none !important; scroll-behavior:auto} }
</style>
</head>
<body>
<a href="#view" class="skip">דלג לתוכן</a>

<button class="logo" id="logoBtn" aria-label="פתח תפריט" aria-expanded="false" aria-controls="drawer">🏜️</button>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-h">
    <b>🏜️ Grand Circle 2026</b>
    <span>5–15 באוגוסט · איתי ורותם</span>
  </div>
  <nav aria-label="ניווט ראשי">
    <button class="mitem" data-view="itinerary"><span class="ic">🗺️</span> המסלול</button>
    <button class="mitem" data-view="tasks"><span class="ic">📝</span> משימות פתוחות <span class="ct" id="ctTasks">–</span></button>
    <button class="mitem" data-view="clothing"><span class="ic">🎒</span> מה ללבוש</button>
    <button class="mitem" data-view="expenses"><span class="ic">💳</span> הוצאות <span class="ct" id="ctExp">–</span></button>
  </nav>
  <div class="drawer-f" id="drawerFoot">טוען נתונים…</div>
</aside>

<header class="top"><div class="top-in">
  <h1 id="tripTitle">🚗 Yosemite ו‑Grand Circle</h1>
  <p id="tripSub"></p>
  <div class="top-facts" id="tripFacts"></div>
</div></header>

<nav class="days" id="daysNav" aria-label="ניווט בין ימי הטיול" hidden>
  <div class="days-in" role="tablist" id="daytabs"></div>
</nav>

<main>
  <div id="view" tabindex="-1" aria-live="polite"><p class="empty">טוען…</p></div>
  <div class="pager" id="pager" hidden>
    <button id="prevBtn" type="button">◄ היום הקודם</button>
    <button id="nextBtn" type="button">היום הבא ►</button>
  </div>
</main>
<footer id="foot"></footer>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const view = $("#view"), tabs = $("#daytabs"), pager = $("#pager"), daysNav = $("#daysNav");

let DATA = { days: [], trip: {} }, TASKS = null, EXPENSES = null, WX = null;
let cur = 0, currentView = "itinerary";

/* ---------------- drawer ---------------- */
const drawer = $("#drawer"), scrim = $("#scrim"), logoBtn = $("#logoBtn");
function setDrawer(open){
  drawer.classList.toggle("on", open);
  scrim.classList.toggle("on", open);
  drawer.setAttribute("aria-hidden", open ? "false" : "true");
  logoBtn.setAttribute("aria-expanded", open ? "true" : "false");
  if (open) drawer.querySelector(".mitem").focus();
}
logoBtn.addEventListener("click", () => setDrawer(!drawer.classList.contains("on")));
scrim.addEventListener("click", () => setDrawer(false));
document.addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
document.querySelectorAll(".mitem").forEach(b =>
  b.addEventListener("click", () => { show(b.dataset.view); setDrawer(false); }));

/* ---------------- weather ---------------- */
const WX_CODE = {
  0:["☀️","בהיר"], 1:["🌤️","בהיר בעיקר"], 2:["⛅","מעונן חלקית"], 3:["☁️","מעונן"],
  45:["🌫️","ערפל"], 48:["🌫️","ערפל"], 51:["🌦️","טפטוף קל"], 53:["🌦️","טפטוף"], 55:["🌦️","טפטוף חזק"],
  61:["🌧️","גשם קל"], 63:["🌧️","גשם"], 65:["🌧️","גשם חזק"],
  80:["🌦️","ממטרים"], 81:["🌦️","ממטרים"], 82:["⛈️","ממטרים עזים"],
  95:["⛈️","סופת רעמים"], 96:["⛈️","סופת רעמים"], 99:["⛈️","סופת רעמים"]
};
const wxIcon = c => WX_CODE[c] || ["🌡️", ""];

/* Open-Meteo only forecasts ~15 days out, so the tail of the trip may fall
   outside the window. Ask for the part it can answer; the rest falls back to
   the August averages baked into days.json. */
function forecastWindow(days){
  const horizon = new Date(Date.now() + 15 * 864e5).toISOString().slice(0, 10);
  const today = new Date().toISOString().slice(0, 10);
  const from = days[0].iso < today ? today : days[0].iso;
  const last = days[days.length - 1].iso;
  const to = last > horizon ? horizon : last;
  return to < from ? null : { from, to };
}

async function loadWeather(days){
  const win = forecastWindow(days);
  if (!win) return {};
  const lat = days.map(d => d.lat).join(","), lon = days.map(d => d.lon).join(",");
  const from = win.from, to = win.to;
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code" +
    "&timezone=auto&start_date=" + from + "&end_date=" + to;
  const res = await fetch(url);
  if (!res.ok) throw new Error("weather " + res.status);
  const json = await res.json();
  const list = Array.isArray(json) ? json : [json];
  const out = {};
  days.forEach((day, i) => {
    const daily = list[i] && list[i].daily;
    if (!daily) return;
    const idx = daily.time.indexOf(day.iso);
    if (idx < 0) return;
    out[day.iso] = {
      max: Math.round(daily.temperature_2m_max[idx]),
      min: Math.round(daily.temperature_2m_min[idx]),
      rain: daily.precipitation_probability_max ? daily.precipitation_probability_max[idx] : null,
      code: daily.weather_code[idx],
      live: true
    };
  });
  return out;
}
/** Forecast if we have it, long-term August averages otherwise. */
function wxFor(day){
  const live = WX && WX[day.iso];
  if (live) return live;
  return { max: day.climate.max, min: day.climate.min, rain: null, code: null, live: false };
}

/* ---------------- clothing ---------------- */
/* Recommendations come from the forecast crossed with what the day actually
   involves — a 35° driving day and a 35° hiking day need different things. */
function clothingFor(day){
  const w = wxFor(day), items = [], key = [];
  const max = w.max, min = w.min;

  if (max >= 38)      key.push("👕 בגדים קלילים ונושמים בלבד");
  else if (max >= 32) key.push("👕 חולצה קצרה + מכנס קצר");
  else if (max >= 24) key.push("👕 חולצה קצרה");
  else                key.push("👔 שכבה ארוכה ליום");

  if (min <= 10)      key.push("🧥 פליז או ג'קט חם לערב");
  else if (min <= 16) key.push("🧥 שכבה חמה לערב");
  else if (min >= 25) items.push("🌙 גם בלילה חם — אין צורך בשכבה");

  if (max >= 30) items.push("🧢 כובע", "🕶️ משקפי שמש", "🧴 קרם הגנה 50", "💧 2–3 ליטר מים לאדם");
  else items.push("🧢 כובע", "🕶️ משקפי שמש", "🧴 קרם הגנה");

  switch (day.kind){
    case "hike-alpine":
      key.push("🥾 נעלי הליכה");
      items.push("🧣 שכבת ביניים — בגובה קר גם בקיץ", "🎒 תיק יום", "🧤 כפפות דקות לזריחה/ערב");
      break;
    case "hike-hot":
      key.push("🥾 נעלי הליכה");
      items.push("🌅 לצאת עם שחר — אחרי 10:00 קשה", "🩳 בגד ים לבריכה", "🧊 מים קפואים מראש");
      break;
    case "water":
      key.push("🩴 נעלי מים (להשכיר בספרינגדייל)", "🩱 בגד ים מתחת לבגדים");
      items.push("👖 בגדים מתייבשים מהר — לא כותנה", "🥢 מקל הליכה לזרם", "🎒 שק אטום לטלפון ולמצלמה", "🧦 גרבי נאופרן — המים קרים");
      break;
    case "water-desert":
      key.push("🩱 בגד ים", "🥾 נעליים סגורות לקניון");
      items.push("🏖️ מגבת", "🎒 תיק קטן — בקניון אין מקום למזוודות", "📷 מצלמה — האור בקניון דרמטי");
      break;
    case "desert-dust":
      key.push("🧣 באף/מטפחת לאבק");
      items.push("👖 בגדים כהים — אבק אדום נדבק לבהיר", "😷 חלון סגור בלולאת העפר", "🧼 מגבונים ברכב");
      break;
    case "drive-city":
      key.push("👗 בגד ערב למסעדה");
      items.push("👟 נעליים נוחות להליכה בסטריפ", "🧥 שכבה דקה — מיזוג עוצמתי בפנים");
      break;
    case "drive": case "drive-rim":
      items.push("👟 נעליים נוחות", "🧥 שכבה דקה לנהיגה עם מיזוג", "🍎 חטיפים ומים ברכב");
      break;
    case "travel":
      key.push("🧥 שכבה לטיסה — קר במטוס");
      items.push("👟 נעליים נוחות", "🎧 אוזניות", "💊 תיק קטן עם המוצרים החיוניים");
      break;
  }
  if (w.rain != null && w.rain >= 30) items.push("🌧️ מעיל גשם קל — " + w.rain + "% סיכוי למשקעים");
  if (day.iso === "2026-08-10") items.push("🌌 שכבה חמה לצפייה בכוכבים — Bryce קפוא בלילה");

  return { key, items, w };
}

/* ---------------- money ---------------- */
const SYM = { USD: "$", ILS: "₪", EUR: "€" };
const money = (n, c) => (SYM[c] || (c + " ")) + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function toBase(item){
  const rate = (EXPENSES.rates && EXPENSES.rates[item.currency]) || 1;
  return item.amount == null ? null : item.amount * rate;
}

/* ---------------- views ---------------- */
function mapUrl(q){ return "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&z=13&output=embed"; }
function linkUrl(q){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q); }

function renderDay(day){
  const w = wxFor(day), ic = wxIcon(w.code);
  const sleep = day.sleep
    ? `<span class="badge ${day.sleep.st === "ok" ? "ok" : "warn"}">🛏️ ${esc(day.sleep.name)} ${day.sleep.st === "ok" ? "✅" : "— לא הוזמן ⚠️"}</span>` : "";
  const drive = day.drive ? `<span class="badge">🚗 ${esc(day.drive)}</span>` : "";

  let html = `<div class="dayhead"><h2>${esc(day.date)} · ${esc(day.title)}</h2>
    <div class="badges">${drive}${sleep}</div></div>`;

  html += `<div class="wxbar${w.live ? "" : " est"}">
      <span class="big">${ic[0]}</span>
      <span class="t">${w.max}°<small> / ${w.min}°</small></span>
      <span class="lbl">${esc(ic[1])}${w.rain != null && w.rain >= 20 ? " · " + w.rain + "% משקעים" : ""}</span>
      <span class="meta">${esc(day.place)} · ${w.live ? "תחזית" : "ממוצע רב‑שנתי לאוגוסט"}</span>
    </div>`;

  if (day.hot && day.hot.length)
    html += `<div class="hot"><h3>🔥 המלצות חמות ליום</h3><ul>${day.hot.map(h => `<li>${esc(h)}</li>`).join("")}</ul></div>`;

  day.stops.forEach(s => {
    const bk = s.booked ? ' <span class="bk">✅ מוזמן</span>'
      : (s.st === "warn" ? ' <span class="bk" style="color:var(--warn)">⚠️</span>' : "");
    const hls = (s.hl || []).map(h => `<li>${esc(h)}</li>`).join("");
    html += `<article class="stop"><div class="stop-top">
      <div class="stop-ico" aria-hidden="true">${s.i}</div>
      <div class="stop-main">
        <span class="stop-time">${esc(s.t)}</span>
        <h3 class="stop-name">${esc(s.n)}${bk}</h3>
        <p class="stop-desc">${esc(s.d)}</p>
        ${hls ? `<ul class="hl">${hls}</ul>` : ""}
        <div class="mapwrap"><iframe loading="lazy" title="מפה: ${esc(s.n)}" src="${mapUrl(s.m)}"></iframe></div>
        <a class="maps" href="${linkUrl(s.m)}" target="_blank" rel="noopener">📍 פתח בגוגל מפס</a>
      </div></div></article>`;
  });
  if (day.food) html += `<div class="food">🍽️ ${day.food}</div>`;
  if (day.tip)  html += `<div class="tip">💡 ${day.tip}</div>`;
  view.innerHTML = html;
}

function selectDay(idx, keepFocus){
  cur = idx;
  document.querySelectorAll(".daytab").forEach((t, i) => {
    const sel = i === idx;
    t.setAttribute("aria-selected", sel ? "true" : "false");
    t.setAttribute("tabindex", sel ? "0" : "-1");
    if (sel && keepFocus) t.focus();
    if (sel) t.scrollIntoView({ inline: "center", block: "nearest" });
  });
  renderDay(DATA.days[idx]);
  $("#prevBtn").disabled = idx === 0;
  $("#nextBtn").disabled = idx === DATA.days.length - 1;
}

function renderTasks(){
  if (!TASKS) return `<p class="empty">לא נטענו משימות.</p>`;
  const label = { urgent: ["דחוף", "t-urgent"], soon: ["בקרוב", "t-soon"], optional: ["רשות", "t-optional"] };
  const order = ["urgent", "soon", "optional"];
  const saved = JSON.parse(localStorage.getItem("tripTasks") || "{}");

  let html = `<div class="page-h"><h2>📝 משימות פתוחות</h2>
    <p>${TASKS.open.length} משימות שעדיין לא נסגרו · עודכן ${esc(TASKS.updated)}</p></div>`;

  order.forEach(u => {
    const rows = TASKS.open.filter(t => t.urgency === u);
    if (!rows.length) return;
    html += `<div class="sec"><h3>${esc(label[u][0])} <span class="tag ${label[u][1]}">${rows.length}</span></h3>`;
    rows.forEach(t => {
      const on = !!saved[t.id];
      html += `<label class="task${on ? " checked" : ""}">
        <input type="checkbox" data-task="${esc(t.id)}"${on ? " checked" : ""}>
        <span class="txt"><b>${esc(t.cat)} — ${esc(t.title)}</b>
        <span class="note">${esc(t.note)}</span></span></label>`;
    });
    html += `</div>`;
  });

  html += `<div class="sec"><h3>כבר סגור <span class="tag t-optional">${TASKS.done.length}</span></h3>
    <ul class="done-list">${TASKS.done.map(d =>
      `<li>${esc(d.title)} <span>· ${esc(d.note)}</span></li>`).join("")}</ul></div>`;
  return html;
}

function renderClothing(){
  let html = `<div class="page-h"><h2>🎒 מה ללבוש</h2>
    <p>לפי אופי היום ותחזית מזג האוויר. הפריטים המודגשים הם ההכרחיים.</p></div>`;
  DATA.days.forEach(day => {
    const c = clothingFor(day), ic = wxIcon(c.w.code);
    html += `<div class="cday">
      <div class="cday-h">
        <b>${esc(day.date)} · ${esc(day.place)}</b>
        <span class="d">${esc(day.dow)}</span>
        <span class="temp">${ic[0]} ${c.w.max}° / ${c.w.min}°</span>
      </div>
      <p class="why">${esc(day.wear)}</p>
      <div class="chips">
        ${c.key.map(k => `<span class="chip key">${esc(k)}</span>`).join("")}
        ${c.items.map(k => `<span class="chip">${esc(k)}</span>`).join("")}
      </div></div>`;
  });
  return html;
}

function renderExpenses(){
  if (!EXPENSES) return `<p class="empty">לא נטענו הוצאות.</p>`;
  const CATS = { flights: "✈️ טיסות", car: "🚗 רכב", hotels: "🛏️ לינה", tours: "🎟️ סיורים" };
  const stLabel = { paid: "שולם", scheduled: "חיוב עתידי", "at-property": "תשלום במקום", booked: "מוזמן" };

  let sure = 0, flagged = 0, unknown = 0;
  EXPENSES.items.forEach(it => {
    const v = toBase(it);
    if (v == null) { unknown++; return; }
    if (it.uncertain) flagged += v; else sure += v;
  });

  let html = `<div class="page-h"><h2>💳 הוצאות הטיול</h2>
    <p>${esc(EXPENSES.source)} · עודכן ${esc(EXPENSES.updated)}</p></div>`;

  html += `<div class="totals">
    <div class="tot main"><div class="k">סה״כ מאומת</div><div class="v">${money(sure, "USD")}</div></div>
    <div class="tot"><div class="k">כולל פריטים לאימות</div><div class="v">${money(sure + flagged, "USD")}</div></div>
    <div class="tot"><div class="k">חסרי סכום</div><div class="v">${unknown}</div></div>
  </div>`;

  Object.keys(CATS).forEach(cat => {
    const rows = EXPENSES.items.filter(i => i.cat === cat);
    if (!rows.length) return;
    const sum = rows.reduce((a, i) => a + (toBase(i) || 0), 0);
    html += `<div class="sec"><h3>${CATS[cat]} <span class="tag t-optional">${money(sum, "USD")}</span></h3>`;
    rows.forEach(i => {
      const base = toBase(i);
      const native = i.amount == null ? "—" : money(i.amount, i.currency);
      const conv = (base != null && i.currency !== "USD") ? `<span class="sub">≈ ${money(base, "USD")}</span>` : "";
      html += `<div class="exp">
        <div class="m"><b>${i.uncertain ? '<span class="flag">⚠️ </span>' : ""}${esc(i.label)}</b>
          <span class="st st-${esc(i.status)}">${esc(stLabel[i.status] || i.status)}</span>
          ${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</div>
        <div class="amt">${native}${conv}</div></div>`;
    });
    html += `</div>`;
  });

  html += `<div class="sec"><h3>🔒 פיקדונות מוחזרים <span class="tag t-optional">לא נספר בסה״כ</span></h3>`;
  EXPENSES.deposits.forEach(d => {
    html += `<div class="exp"><div class="m"><b>${esc(d.label)}</b>
      <span class="note">${esc(d.note)}</span></div>
      <div class="amt">${money(d.amount, d.currency)}</div></div>`;
  });
  html += `</div>`;

  html += `<div class="sec"><h3>⏳ עדיין לא שולם <span class="tag t-soon">${EXPENSES.missing.length}</span></h3>`;
  EXPENSES.missing.forEach(m => {
    html += `<div class="exp"><div class="m"><b>${esc(m.label)}</b>
      <span class="note">${esc(m.note)}</span></div></div>`;
  });
  html += `</div>`;
  return html;
}

function show(name){
  currentView = name;
  document.querySelectorAll(".mitem").forEach(b =>
    b.setAttribute("aria-current", b.dataset.view === name ? "page" : "false"));
  const isItin = name === "itinerary";
  daysNav.hidden = !isItin;
  pager.hidden = !isItin;
  if (isItin) selectDay(cur);
  else view.innerHTML = name === "tasks" ? renderTasks()
                      : name === "clothing" ? renderClothing()
                      : renderExpenses();
  view.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "instant" });
}

/* task checkboxes persist locally so ticking one survives a refresh */
view.addEventListener("change", e => {
  const cb = e.target.closest("input[data-task]");
  if (!cb) return;
  const saved = JSON.parse(localStorage.getItem("tripTasks") || "{}");
  saved[cb.dataset.task] = cb.checked;
  localStorage.setItem("tripTasks", JSON.stringify(saved));
  cb.closest(".task").classList.toggle("checked", cb.checked);
});

/* ---------------- boot ---------------- */
async function boot(){
  let loadErr = null;
  try {
    const [d, t, e] = await Promise.all([
      fetch("data/days.json").then(r => r.json()),
      fetch("data/tasks.json").then(r => r.json()).catch(() => null),
      fetch("data/expenses.json").then(r => r.json()).catch(() => null)
    ]);
    DATA = d; TASKS = t; EXPENSES = e;
  } catch (err) {
    view.innerHTML = `<p class="empty">לא הצלחתי לטעון את נתוני הטיול.<br>${esc(err.message)}</p>`;
    return;
  }

  $("#tripTitle").textContent = "🚗 " + DATA.trip.title;
  $("#tripSub").textContent = DATA.trip.subtitle;
  $("#tripFacts").innerHTML = DATA.trip.facts.map(f => `<span>${esc(f)}</span>`).join("");
  $("#ctTasks").textContent = TASKS ? TASKS.open.length : "–";
  $("#ctExp").textContent = EXPENSES ? EXPENSES.items.length : "–";
  $("#foot").textContent = "זמני נהיגה ומרחקים הם הערכות — לאשר שעות פתיחה, הזמנות והיתרים סמוך לתאריך. " +
    "מפות מוטמעות מ‑Google Maps, תחזית מ‑Open‑Meteo.";

  DATA.days.forEach((day, idx) => {
    const b = document.createElement("button");
    b.className = "daytab"; b.setAttribute("role", "tab"); b.id = "tab-" + idx;
    b.setAttribute("aria-controls", "view");
    b.innerHTML = esc(day.date.replace(" באוג'", "")) + "<small>" + esc(day.dow) + "</small>";
    b.addEventListener("click", () => selectDay(idx));
    b.addEventListener("keydown", ev => {
      if (ev.key === "ArrowLeft"){ ev.preventDefault(); selectDay(Math.min(cur + 1, DATA.days.length - 1), true); }
      if (ev.key === "ArrowRight"){ ev.preventDefault(); selectDay(Math.max(cur - 1, 0), true); }
    });
    tabs.appendChild(b);
  });

  $("#prevBtn").addEventListener("click", () => selectDay(Math.max(cur - 1, 0)));
  $("#nextBtn").addEventListener("click", () => selectDay(Math.min(cur + 1, DATA.days.length - 1)));

  /* open on today's leg if the trip is underway */
  const today = new Date().toISOString().slice(0, 10);
  const todayIdx = DATA.days.findIndex(d => d.iso === today);
  if (todayIdx >= 0) cur = todayIdx;

  show("itinerary");

  try {
    WX = await loadWeather(DATA.days);
    const live = Object.keys(WX).length;
    $("#drawerFoot").textContent = live
      ? `תחזית חיה ל‑${live} מתוך ${DATA.days.length} ימים · Open‑Meteo`
      : "תחזית לא זמינה — מוצגים ממוצעים לאוגוסט";
    DATA.days.forEach((day, i) => {
      const w = WX[day.iso];
      if (!w) return;
      const tab = document.getElementById("tab-" + i);
      if (tab && !tab.querySelector(".wx"))
        tab.insertAdjacentHTML("beforeend", `<span class="wx">${w.max}°</span>`);
    });
    if (currentView === "itinerary") renderDay(DATA.days[cur]);
    else if (currentView === "clothing") view.innerHTML = renderClothing();
  } catch (err) {
    $("#drawerFoot").textContent = "תחזית לא זמינה — מוצגים ממוצעים רב‑שנתיים לאוגוסט";
  }
}
boot();
</script>
